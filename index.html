<!DOCTYPE html>
<html lang="ar" translate="no" >
<head>
  <meta name="google" content="notranslate" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كل سنة وانتي طيبة❤️ </title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Aref+Ruqaa:wght@700&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="lock"><div class="lock-box">
  <div class="big">🔐</div><h2 id="lockTitle"></h2>
  <div id="cd" class="cd"></div><p id="hint"></p>
  <input id="pw" type="password" inputmode="numeric" autocomplete="off" aria-label="password">
  <button id="go"></button><div class="err" id="err"></div>
</div></div>
<button id="mute" aria-label="sound">🔊</button>
<div id="hearts"></div><div id="fly"></div><div id="confetti"></div>
<main id="main">
  <section class="hero"><h1 id="title"></h1><p id="sub"></p><div class="scroll">⬇️</div></section>
  <section id="sSec"><h2 class="sec" id="sT"></h2><div class="story" id="story"></div></section>
  <section id="gSec"><h2 class="sec" id="gT"></h2><div class="gallery" id="gallery"></div></section>
  <section id="vSec"><h2 class="sec" id="vT"></h2><div class="videos" id="videos"></div></section>
  <section id="cakeSec" class="cakeSec"><h2 class="sec" id="cT"></h2>
    <svg id="cake" viewBox="0 0 200 190" width="260" aria-hidden="true">
      <ellipse cx="100" cy="176" rx="90" ry="9" fill="var(--accent2)" opacity=".5"/>
      <rect x="25" y="120" width="150" height="52" rx="12" fill="var(--accent)"/>
      <rect x="45" y="78" width="110" height="46" rx="11" fill="var(--accent2)"/>
      <path d="M25 134q12 14 25 0t25 0 25 0 25 0 25 0 25 0v-8H25z" fill="#fff" opacity=".85"/>
      <g id="candles">
        <g><rect x="64" y="52" width="8" height="28" rx="3" fill="#fff"/><ellipse class="flame" cx="68" cy="44" rx="6" ry="10" fill="#ffc94d"/></g>
        <g><rect x="96" y="48" width="8" height="32" rx="3" fill="#fff"/><ellipse class="flame" cx="100" cy="40" rx="6" ry="10" fill="#ffc94d"/></g>
        <g><rect x="128" y="52" width="8" height="28" rx="3" fill="#fff"/><ellipse class="flame" cx="132" cy="44" rx="6" ry="10" fill="#ffc94d"/></g>
      </g>
    </svg>
    <button id="blow" class="btn"></button><p id="wish" class="wish"></p>
  </section>
  <section class="letter"><h3 id="lt"></h3><p id="lp"></p></section>
  <footer id="foot"></footer>
</main>
<div id="lightbox"><img alt=""></div>
<audio id="audio" loop></audio>
<script src="config.js" onerror="alert('config.js مش موجود جنب index.html')"></script>
<script src="script.js"></script>
</body></html>
